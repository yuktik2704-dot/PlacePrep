<!DOCTYPE html>
<html lang="en">

<head>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">

<link rel="icon" type="image/png" sizes="32x32"
href="assets/favicon-32x32.png">

<link rel="icon" type="image/png" sizes="16x16"
href="assets/favicon-16x16.png">

<link rel="apple-touch-icon"
href="assets/apple-touch-icon.png">

<link rel="manifest"
href="assets/site.webmanifest">
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome Back • PlacePrep AI</title>

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/login.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="bg-blur blur1"></div>
<div class="bg-blur blur2"></div>
<div class="bg-blur blur3"></div>

<div class="login-wrapper">

<div class="left-panel">

<div class="brand">

<img src="assets/logo-icon.png" alt="PlacePrep AI">

<h1>PlacePrep AI</h1>

<p>

AI Powered Career Companion

</p>

</div>

<div class="preview-card">

<div class="preview-header">

<h3>Live Resume Insights</h3>

<span class="live">
● Live
</span>

</div>

<div class="ats-circle" id="atsCircle">
AI
</div>

<div class="mini-grid">

<div>

<h3>18</h3>

<p>Skills</p>

</div>

<div>

<h3>5</h3>

<p>Projects</p>

</div>

<div>

<h3>94%</h3>

<p>ATS</p>

</div>

</div>

<div class="progress-box">

<div class="progress-title">

Resume Health

<span>92%</span>

</div>

<div class="progress">

<div class="fill fill1"></div>

</div>

</div>

<div class="progress-box">

<div class="progress-title">

Interview Ready

<span>95%</span>

</div>

<div class="progress">

<div class="fill fill2"></div>

</div>

</div>

</div>

</div>

<div class="right-panel">

<div class="login-card">

<div class="login-top">

<h2>

Welcome Back 👋

</h2>

<p>

Continue your placement journey with AI.

</p>

</div>

<form id="loginForm">

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

</div>

<div class="login-options">

<label class="remember">

<input type="checkbox">

Remember Me

</label>

<a href="#" onclick="comingSoon()">
Forgot Password?
</a>

</div>

<button
type="submit"
class="login-btn">

Continue →

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<button class="google-btn">

<img
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
width="20">

Continue with Google

</button>

<div class="signup-text">

New to PlacePrep AI?

<a href="signup.html">

Create Account

</a>

</div>

</div>

</div>

</div>

<script src="js/login.js"></script>

</body>

</html>
