<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interview Result</title>

    <link rel="stylesheet" href="css/result.css">

</head>

<body>

<div class="container">

    <div class="resultCard">

        <h1>🎉 Interview Completed</h1>

        <p class="subtitle">
            AI Performance Report
        </p>

        <!-- Overall Score -->

        <div class="overall">

            <div class="circle">

                <span id="overallScore">0</span>

            </div>

            <h2>Overall Score</h2>

        </div>

        <!-- Progress Bars -->

        <div class="scores">

            <div class="scoreItem">

                <label>Technical</label>

                <div class="progress">

                    <div id="technicalBar" class="fill"></div>

                </div>

                <span id="technicalScore">0</span>

            </div>

            <div class="scoreItem">

                <label>Communication</label>

                <div class="progress">

                    <div id="communicationBar" class="fill"></div>

                </div>

                <span id="communicationScore">0</span>

            </div>

            <div class="scoreItem">

                <label>Confidence</label>

                <div class="progress">

                    <div id="confidenceBar" class="fill"></div>

                </div>

                <span id="confidenceScore">0</span>

            </div>

        </div>

        <!-- Strengths -->

        <div class="section">

            <h2>⭐ Strengths</h2>

            <ul id="strengthList"></ul>

        </div>

        <!-- Improvements -->

        <div class="section">

            <h2>📈 Areas to Improve</h2>

            <ul id="improvementList"></ul>

        </div>

        <!-- Feedback -->

        <div class="section">

            <h2>🤖 AI Feedback</h2>

            <p id="feedback"></p>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button id="dashboardBtn">

                Dashboard

            </button>

            <button id="retakeBtn">

                Retake Interview

            </button>

        </div>

    </div>

</div>

<script src="js/result.js"></script>
<div id="toast"></div>
<script src="js/toast.js"></script>
<script src="js/result.js"></script>

</body>

</html>
